<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantage</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Vantage</h1>
      <p class="tagline">Your last 20 games, read closely</p>
    </div>
    <nav id="tabs" class="tabs" hidden>
      <button class="tab" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="review">Review</button>
      <button id="switch-account" class="tab tab-ghost" title="Use a different account">Switch</button>
    </nav>
  </header>

  <main id="app">
    <!-- First run: who are you? -->
    <section id="landing" class="view" hidden>
      <form id="lookup-form">
        <label for="steam-input">Steam profile link or account ID</label>
        <input id="steam-input" type="text" autocapitalize="none" spellcheck="false" placeholder="https://steamcommunity.com/profiles/..." aria-describedby="steam-input-help" required>
        <p id="steam-input-help" class="hint">Paste a numeric Steam profile link, SteamID64, or account ID. Custom /id/ links are not supported yet.</p>
        <p class="hint">Vantage keeps your last 20 games on this device and only fetches what's new after that.</p>
        <label class="toggle-row">
          <input id="teaching-toggle" type="checkbox">
          <span>Teaching mode &mdash; explain terms as it goes</span>
        </label>
        <button type="submit">Open my dashboard</button>
      </form>
    </section>

    <section id="dashboard" class="view" hidden></section>

    <section id="review" class="view" hidden>
      <button id="back-btn" class="link-btn">&larr; Back to dashboard</button>
      <div id="review-card"></div>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script src="steamid.js?v=7"></script>
  <script src="api.js?v=6"></script>
  <script src="queue.js?v=6"></script>
  <script src="store.js?v=6"></script>
  <script src="assets.js?v=6"></script>
  <script src="history.js?v=6"></script>
  <script src="analyze.js?v=6"></script>
  <script src="charts.js?v=6"></script>
  <script src="dashboard.js?v=6"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
