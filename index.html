<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantage</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="topbar">
    <h1>Vantage</h1>
    <p class="tagline">Coaching-first match review for Deadlock</p>
  </header>

  <main id="app">
    <section id="landing" class="view">
      <form id="lookup-form">
        <label for="steam-input">Steam ID or account ID</label>
        <input id="steam-input" type="text" inputmode="numeric" placeholder="e.g. 186993885" required>
        <p class="hint">Compares against your last 20 games, cached on this device — later visits only fetch what's new.</p>

        <label class="toggle-row">
          <input id="teaching-toggle" type="checkbox">
          <span>Teaching mode &mdash; explain terms as it goes</span>
        </label>

        <button type="submit">Review my last match</button>
      </form>
      <p id="status" class="status"></p>
    </section>

    <section id="review" class="view" hidden>
      <button id="back-btn" class="link-btn">&larr; New lookup</button>
      <div id="review-card"></div>
    </section>
  </main>

  <script src="steamid.js?v=5"></script>
  <script src="api.js?v=5"></script>
  <script src="queue.js?v=5"></script>
  <script src="store.js?v=5"></script>
  <script src="history.js?v=5"></script>
  <script src="analyze.js?v=5"></script>
  <script src="charts.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
